<div class="container" id="container" #container><form>
  <h1>
    <label class="form-label" for="form2Example1">Login</label>
  </h1>
  <!-- Email input -->
  <div class="form-outline mb-4">
    <label class="form-label" for="form2Example1">Username</label>
    <input type="email" id="form2Example1" class="form-control" [(ngModel)]="usuario.username" name="username" />
  </div>

  <!-- Password input -->
  <div class="form-outline mb-4">
    <label class="form-label" for="form2Example2">Password</label>
    <input type="password" id="form2Example2" class="form-control" [(ngModel)]="usuario.password" name="password" />
  </div>

  <!-- 2 column grid layout for inline styling -->
  <div class="row mb-4">
    <div class="col d-flex justify-content-center">
      <!-- Checkbox -->
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="form2Example31" checked />
        <label class="form-check-label" for="form2Example31"> Remember me </label>
      </div>
    </div>

    <div class="col">
      <!-- Simple link -->
      <a href="#!">Forgot password?</a>
    </div>
  </div>

  <!-- Submit button -->
  <button type="button" class="btn btn-primary btn-block mb-4" (click)="ingresorestringido()">Sign in</button>

  <!-- Register buttons -->
  <div class="text-center">
    <p>Not a member? <a (click)="ingresorestringido()">Register</a></p>
  </div>
</form>
</div>
