<div class="card bg-dark text-white">
    <div class="card-body">
        <form ngNativeValidate (ngSubmit)="crearProteccion()">
            <div class="form-group row">
                <label for="nombre" class="coll-form-label col-sm-2">Nombre</label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" [(ngModel)]="proteccion.nombre" name="nombre" required>
                </div>
            </div>

            <div class="form-group row">
                <label for="precio" class="coll-form-label col-sm-2">Precio</label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" [(ngModel)]="proteccion.precio" name="precio" required>
                </div>
            </div>

            <div class="form-group row">
                <div class="col-sm-6">
                    <button class="btn btn-primary" role="button">Actualizar</button>
                </div>
            </div>      
        </form>
