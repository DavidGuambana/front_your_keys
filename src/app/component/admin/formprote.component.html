<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Editar Proteccion</h3>
                    <form ngNativeValidate (ngSubmit)="crearProteccion()">

                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" class="form-control" [(ngModel)]="proteccion.nombre" name="nombre"
                                required>
                        </div>

                        <div class="form-group row">
                            <label for="precio">Precio</label>
                            <div class="col-sm-6">
                                <input type="text" class="form-control" [(ngModel)]="proteccion.precio" name="precio"
                                    required>
                            </div>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-block">Actualizar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
