<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Agrega cualquier otra configuración del head que necesites -->
</head>
<body>

  <div style="text-align: left;">
    <button type="button" (click)="toggleContenido()" class="btn btn-primary">{{mostrarContenido ? 'Ocultar' : 'Registrar'}} Modelo</button>
    <button type="button" (click)="toggleContenido2()" class="btn btn-primary">{{mostrarContenido2 ? 'Ocultar' : 'Registrar'}} Marca</button>
    <button type="button" (click)="toggleContenido3()" class="btn btn-primary">{{mostrarContenido3 ? 'Ocultar' : 'Registrar'}} Proteccion</button>
    <button type="button" (click)="toggleContenido4()" class="btn btn-primary">{{mostrarContenido4 ? 'Ocultar' : 'Registrar'}} Categoria</button>
  </div>

  <div *ngIf="mostrarContenido">
    <form>
      <div class="form-group">
        <h1>Registro de Modelos</h1>
        <label for="nombre">Nombre del Modelo:</label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="nuevoModelo.nombre" class="form-control">
      </div>
      
      <div class="form-group">
        <label for="marca">Marca:</label>
        <select name="marca" id="marca" class="form-control" [(ngModel)]="nuevoModelo.id_marca">
          <option value="-1">[Seleccione]</option>
          <option *ngFor="let marca of marcasList" [ngValue]="marca.id_marca">
            {{ marca.nombre }}
          </option>
        </select>
      </div>

      <button type="button" (click)="crearModelo()" class="btn btn-primary">Guardar</button>
    </form>
  </div>

  <div *ngIf="mostrarContenido2">
    <form>
      <div class="form-group">
        <h1>Registro de Marcas</h1>
        <label for="nombreMarca">Nombre del Marca:</label>
        <input type="text" id="nombreMarca" name="nombreMarca" [(ngModel)]="nuevaMarca.nombre" class="form-control">
      </div>
      <button type="button" (click)="crearMarca()" class="btn btn-primary">Guardar</button>
    </form>
  </div>


  <div *ngIf="mostrarContenido3">
    <form>
      <div class="form-group">
        <h1>Registro de Proteccion</h1>
        <label for="nombreProteccion">Nombre de Proteccion:</label>
        <input type="text" id="nombreProteccion" name="nombreProteccion" [(ngModel)]="nuevaProteccion.nombre" class="form-control">
  
        <label for="precioProteccion">Precio de Proteccion:</label>
        <input type="number" id="precioProteccion" name="precioProteccion" [(ngModel)]="nuevaProteccion.precio" class="form-control">
      </div>
  
      <button type="button" (click)="crearProteccion()" class="btn btn-primary">Guardar</button>
    </form>
  </div>

  <div *ngIf="mostrarContenido4">
    <form>
      <div class="form-group">
        <h1>Registro de Categoria</h1>
        <label for="nombreCategoria">Nombre de Categoria:</label>
        <input type="text" id="nombreCategoria" name="nombreCategoria" [(ngModel)]="nuevaCategoria.nombre" class="form-control">
      </div>
  
      <button type="button" (click)="crearCategoria()" class="btn btn-primary">Guardar</button>
    </form>
  </div>
  

</body>
</html>
