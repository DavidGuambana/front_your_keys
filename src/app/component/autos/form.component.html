<!-- autos-form.component.html -->
<div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Autos | Formulario</h4>
          <div class="card-body border-top">
            <div class="row">
              <!-- Columna de inputs a la izquierda -->
              <div class="col-12 col-md-6 col-xl-6">
                <div class="form-group local-forms mb-3">
                  <label>Matrícula <span class="login-danger">*</span></label>
                  <input class="form-control" type="text" placeholder="Ejemplo: ABC-123">
                </div>
  
                <div class="form-group local-forms mb-3">
                  <label>ID Modelo <span class="login-danger">*</span></label>
                  <input class="form-control" type="number" placeholder="Ejemplo: 1">
                </div>
  
                <div class="form-group local-forms mb-3">
                  <label>ID Categoría <span class="login-danger">*</span></label>
                  <input class="form-control" type="number" placeholder="Ejemplo: 1">
                </div>
  
                <div class="form-group local-forms mb-3">
                  <label>Color <span class="login-danger">*</span></label>
                  <input class="form-control" type="text" placeholder="Ejemplo: Rojo">
                </div>
  
                <div class="form-group local-forms mb-3">
                  <label>Capacidad <span class="login-danger">*</span></label>
                  <input class="form-control" type="number" placeholder="Ejemplo: 5">
                </div>
  
                <div class="form-group local-forms mb-3">
                  <label>Potencia <span class="login-danger">*</span></label>
                  <input class="form-control" type="number" placeholder="Ejemplo: 200">
                </div>
  
                <div class="form-group local-forms mb-3">
                  <label>Precio Diario <span class="login-danger">*</span></label>
                  <input class="form-control" type="number" placeholder="Ejemplo: 50">
                </div>
              </div>
               <!-- Columna de archivo al mismo nivel que los inputs sin título -->
               <div class="col-12 col-md-6 col-xl-6 text-center"> <!-- Agregada la clase text-center -->
                <label for="imagenInput" class="btn btn-primary btn-block">Seleccionar Imagen</label>
                <input type="file" id="imagenInput" (change)="onFileSelected($event)" accept="image/*" class="d-none">
                <!-- Espacio para la imagen -->
                <div class="imagen-container mt-3" style="width: 300px; height: 300px;">
                    <img *ngIf="imagenUrl !== undefined && imagenUrl" [src]="imagenUrl" alt="Imagen actual" class="imagen-redonda img-fluid" />
                  </div>                
              <!-- Columna de archivo al mismo nivel que los inputs sin título -->
              <div class="col-12 col-md-6 col-xl-6">
              </div>
              
            </div>
          </div>
           <button type="button" class="btn btn-rounded btn-success">Guardar</button>
        </div>
       
      </div>
      
    </div>
    
  </div>
