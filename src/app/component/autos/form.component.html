<!-- autos-form.component.html -->
<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Autos | Formulario</h4>
        <div class="card-body border-top">
          <div class="row">
            <form (ngSubmit)="create()">
              <div class="container">
                <div class="row">
                  <!-- Primer bloque de elementos del formulario -->
                  <div class="col-12 col-md-6 col-xl-6">
                    <div class="form-group local-forms mb-3">
                      <label for="matricula">Matrícula <span class="login-danger">*</span></label>
                      <input id="matricula" class="form-control" type="text" placeholder="Ejemplo: ABC-123" [(ngModel)]="auto.matricula" name="matricula">
                    </div>
            
                    <div class="form-group local-forms mb-3">
                      <label for="idMarca">Marca:</label>
                      <select name="Marca" id="Marca" class="form-control" (change)="cargarModelos()" [(ngModel)]="id_marca">
                          <option value="-1">[Seleccione]</option>
                          <option *ngFor="let marca of marcasList" [ngValue]="marca.id_marca">
                              {{ marca.nombre }}
                          </option>
                      </select>
                  </div>
            
                    <div class="form-group local-forms mb-3">
                      <label for="idModelo">Modelo<span class="login-danger">*</span></label>
                      <select name="Modelo" id="Modelo" class="form-control" [(ngModel)]="auto.id_modelo">
                        <option value="-1">[Seleccione]</option>
                        <option *ngFor="let modelo of modelosList" [value]="modelo.id_modelo">
                          {{ modelo.nombre }}
                        </option>
                      </select>
                    </div>
            
                    <div class="form-group local-forms mb-3">
                      <label for="idCategoria">Categoria<span class="login-danger">*</span></label>
                      <select name="Categoria" id="Categoria" class="form-control" [(ngModel)]="auto.id_categoria">
                        <option value="-1">[Seleccione]</option>
                        <option *ngFor="let cate of categoriaList" [value]="cate.id_categoria">
                          {{ cate.nombre }}
                        </option>
                      </select>
                    </div>
            
                    <div class="form-group local-forms mb-3">
                      <label for="color">Color <span class="login-danger">*</span></label>
                      <input id="color" class="form-control" type="text" placeholder="Ejemplo: Rojo" [(ngModel)]="auto.color" name="color">
                    </div>
            
                    <div class="form-group local-forms mb-3">
                      <label for="capacidad">Capacidad <span class="login-danger">*</span></label>
                      <input id="capacidad" class="form-control" type="number" placeholder="Ejemplo: 5" [(ngModel)]="auto.capacidad" name="capacidad">
                    </div>
            
                    <div class="form-group local-forms mb-3">
                      <label for="potencia">Potencia <span class="login-danger">*</span></label>
                      <input id="potencia" class="form-control" type="number" placeholder="Ejemplo: 200" [(ngModel)]="auto.potencia" name="potencia">
                    </div>
            
                    <div class="form-group local-forms mb-3">
                      <label for="precioDiario">Precio Diario <span class="login-danger">*</span></label>
                      <input id="precioDiario" class="form-control" type="number" placeholder="Ejemplo: 50" [(ngModel)]="auto.precio_diario" name="precioDiario">
                    </div>
                  </div>
            
                  <!-- Segundo bloque de elementos del formulario -->



                  <div class="col-12 col-md-6 col-xl-6 text-center">              
                    <label for="imagenInput" class="btn btn-primary btn-block">Seleccionar Imagen</label>
                    <input type="file" id="imagenInput" (change)="onFileSelected($event)" accept="image/*" class="d-none">
                    <div class="imagen-container mt-3" style="width: 300px; height: 300px;">
                      <img *ngIf="imagenUrl !== undefined && imagenUrl" [src]="imagenUrl" alt="Imagen actual" class="imagen-redonda img-fluid" />
                    </div>
                    <!-- Columna de archivo al mismo nivel que los inputs sin título -->
                    <div class="col-12 col-md-6 col-xl-6"></div>
                  </div>
                </div>
            
                <!-- Botón de envío del formulario -->
                <div class="col-12 text-center mt-3">
                  <button class="btn btn-primary">Guardar</button>
                </div>
              </div>
            </form>

          </div>

        </div>

      </div>

    </div>
